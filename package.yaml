name:                prob-den
version:             0.1.0.0
author:              "Joe Qian"
maintainer:          "qzy@g.ucla.edu"
description:         Exploration of denotation of probabilistic programs
ghc-options:         -Wall -O2

dependencies:
- base
- mwc-random
- mtl
- transformers
- containers >= 0.8 # non-allocating Ord IntSet (compareIntSets)
- array
- reflection
- megaparsec >= 8.0.0 # registerParseError
- parser-combinators >= 1.0.0
- text
- scientific >= 0.3.6.0

library:
  source-dirs: src

executables:
  prob:
    main: Main.hs
    source-dirs: main
    dependencies:
      - base
      - optparse-applicative
      - prob-den

tests:
  # Both suites live in test/ and both are their own Main, so neither may pick
  # up the other as an ordinary module.
  linear-eq-test:
    main: LinearEqTest.hs
    source-dirs: test
    other-modules: []
    dependencies:
      - QuickCheck
      - prob-den
  desugar-test:
    main: DesugarTest.hs
    source-dirs: test
    other-modules: []
    dependencies:
      - QuickCheck
      - prob-den
